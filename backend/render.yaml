services:
  - type: web
    name: climascope-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: climascope-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://climascope.vercel.app,http://localhost:5173,http://localhost:3000
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_API_KEY
        sync: false

databases:
  - name: climascope-db
    databaseName: climascope
    user: climascope_admin
    plan: free
